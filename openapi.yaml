          items:
            type: string
        excludedPackageIds:
          description: Gói bỏ khỏi BBNT nháp (thay toàn bộ); tính lại
          type: array
          items:
            type: string
    AdjustItemDto:
      type: object
      properties:
        quantity:
          type: number
          example: 12
          description: Khối lượng cuối (2 chữ số lẻ)
        unitPrice:
          type: number
          example: 300000
        productLabel:
          type: string
          maxLength: 200
        reason:
          type: string
          maxLength: 2000
          description: Bắt buộc khi khối lượng / đơn giá khác giá trị hệ thống tính (BR-14)
    AcceptanceReasonDto:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - reason
    ApproveAcceptanceDto:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
          description:
            "Bắt buộc khi BBNT còn cảnh báo (80/20, tụt Mức…): quyết định của
            người duyệt (Q-R3)"
    SignAcceptanceDto:
      type: object
      properties:
        signedFileId:
          type: string
          format: uuid
          description: Bản ký đã tải lên (chứng từ, PR sau)
        signedDate:
          type: string
          example: 2026-08-05
          description: Ngày ký, mặc định hôm nay; tính hạn thanh toán (BR-34)
    CreatePaymentDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - advance
            - settlement
            - refund
          description:
            "advance: chi tạm ứng (FR-$-01); settlement: chi trả BBNT đã ký
            (cần acceptanceId, FR-$-02); refund: đối tác hoàn tạm ứng (FR-C-10)"
        acceptanceId:
          type: string
          format: uuid
          description: BBNT được chi trả (bắt buộc với settlement)
        amount:
          type: number
          example: 50000000
          description: Số tiền (đồng), > 0
        paidDate:
          type: string
          example: 2026-08-05
          description: Ngày chi / ngày nhận hoàn, không sau hôm nay
        method:
          type: string
          enum:
            - bank_transfer
            - cash
            - other
          default: bank_transfer
        reference:
          type: string
          maxLength: 200
          description: Mã giao dịch ngân hàng
        note:
          type: string
          maxLength: 2000
      required:
        - kind
        - amount
        - paidDate
    CancelPaymentDto:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - reason
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ApiResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
        - success
        - error
      properties:
        data: {}
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        success:
          type: boolean
        error:
          allOf:
            - $ref: "#/components/schemas/ApiError"
          nullable: true
    ListResponse:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
        - totalPages
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    CursorListResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
          nullable: true
    Asset:
      type: object
      required:
        - id
        - assetType
        - originalFilename
        - mimeType
        - fileSizeBytes
        - processingStatus
      properties:
        id:
          type: string
          format: uuid
        assetType:
          type: string
          enum:
            - image
            - video
        originalFilename:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: string
        processingStatus:
          type: string
        processingError:
          type: string
          nullable: true
        sourceMetadata:
          type: object
          additionalProperties: true
    ProjectMedia:
      type: object
      required:
        - id
        - projectId
        - assetId
        - sortOrder
        - evaluationStatus
        - asset
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        sortOrder:
          type: integer
        caption:
          type: string
          nullable: true
        evaluationStatus:
          type: string
          enum:
            - pending
            - approved
            - rejected
        durationSeconds:
          type: number
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true

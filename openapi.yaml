info:
  title: AG Go API
  description: AG Go backend API
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: http://localhost:3737/api
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        parentId:
          type: string
          format: uuid
        sortOrder:
          type: number
          minimum: 0
      required:
        - name
    UpdateFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        sortOrder:
          type: number
          minimum: 0
    SetFolderGrantDto:
      type: object
      properties:
        accessLevel:
          type: string
          enum:
            - viewer
            - editor
            - manager
        inheritChildren:
          type: boolean
          default: true
      required:
        - accessLevel
    CreateCategoryDto:
      type: object
      properties: {}
    UpdateCategoryDto:
      type: object
      properties: {}
    CreateCountryDto:
      type: object
      properties: {}
    CreateProvinceDto:
      type: object
      properties: {}
    CreateTagDto:
      type: object
      properties: {}
    UpdateTagDto:
      type: object
      properties: {}
    CreateProjectDto:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        countryId:
          type: string
          format: uuid
        provinceId:
          type: string
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        tags:
          type: array
          items:
            type: string
      required:
        - folderId
        - name
    UpdateProjectDto:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        countryId:
          type: string
          format: uuid
          nullable: true
        provinceId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
    CreateProjectMediaDto:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        assetType:
          type: string
          enum:
            - image
            - video
        originalFilename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          maxLength: 100
        fileSizeBytes:
          type: number
          minimum: 0
        extension:
          type: string
          maxLength: 20
        originalBucket:
          type: string
          maxLength: 100
        originalStorageKey:
          type: string
          maxLength: 500
        sortOrder:
          type: number
          minimum: 0
        caption:
          type: string
          maxLength: 500
    UpdateProjectMediaDto:
      type: object
      properties:
        sortOrder:
          type: number
          minimum: 0
        caption:
          type: string
          maxLength: 500
        evaluationStatus:
          type: string
          enum:
            - pending
            - approved
            - rejected
        comment:
          type: string
          maxLength: 2000
          nullable: true
    ReorderProjectMediaDto:
      type: object
      properties:
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - mediaIds
    SetProjectThumbnailDto:
      type: object
      properties:
        projectMediaId:
          type: string
          format: uuid
          nullable: true
    CreateUploadSessionDto:
      type: object
      properties:
        assetType:
          type: string
          enum:
            - image
            - video
        originalFilename:
          type: string
          maxLength: 255
        extension:
          type: string
          maxLength: 20
        mimeType:
          type: string
          maxLength: 100
        fileSizeBytes:
          type: number
          minimum: 1
        expectedChecksumSha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        targetProjectId:
          type: string
          format: uuid
          description: Project that owns this uploaded asset
      required:
        - assetType
        - originalFilename
        - mimeType
        - fileSizeBytes
        - targetProjectId
    UploadPartsDto:
      type: object
      properties:
        uploadSessionId:
          type: string
          format: uuid
        partNumbers:
          minItems: 1
          maxItems: 100
          description: Part numbers (1-based) to get presigned upload URLs for
          type: array
          items:
            type: number
      required:
        - uploadSessionId
        - partNumbers
    CompleteUploadDto:
      type: object
      properties:
        uploadSessionId:
          type: string
          format: uuid
        checksumSha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
      required:
        - uploadSessionId
    AbortUploadDto:
      type: object
      properties:
        uploadSessionId:
          type: string
          format: uuid
      required:
        - uploadSessionId
    UpdateRenderProfileDto:
      type: object
      properties: {}
    CreateWatermarkLogoUploadSessionDto:
      type: object
      properties:
        originalFilename:
          type: string
          maxLength: 255
        extension:
          type: string
          maxLength: 20
        fileSizeBytes:
          type: number
          minimum: 1
        expectedChecksumSha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        mimeType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
      required:
        - originalFilename
        - fileSizeBytes
        - mimeType
    CreateRenderBatchDto:
      type: object
      properties: {}
    RerenderWatermarkDto:
      type: object
      properties: {}
    CreateDownloadDto:
      type: object
      properties: {}
    SummarizeSourceDto:
      type: object
      properties:
        fileId:
          type: string
        driveId:
          type: string
      required:
        - fileId
    SummarizeSourcesDto:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SummarizeSourceDto"
      required:
        - projectId
        - sources
    GoogleDriveImportSourceDto:
      type: object
      properties:
        fileId:
          type: string
        driveId:
          type: string
        name:
          type: string
        mimeType:
          type: string
      required:
        - fileId
    CreateImportDto:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        sourceRootId:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/GoogleDriveImportSourceDto"
        sourceDriveId:
          type: string
        idempotencyKey:
          type: string
        duplicatePolicy:
          type: string
          enum:
            - create_new
            - reuse_existing
            - overwrite_existing
          default: reuse_existing
      required:
        - projectId
    UpdateSettingsDto:
      type: object
      properties: {}
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ApiResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
        - success
        - error
      properties:
        data: {}
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        success:
          type: boolean
        error:
          allOf:
            - $ref: "#/components/schemas/ApiError"
          nullable: true
    ListResponse:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
        - totalPages
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

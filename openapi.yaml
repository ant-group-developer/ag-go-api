          schema:
            type: array
            items:
              type: string
        - name: timesOfDay
          required: false
          in: query
          description: Comma-separated times of day.
          schema:
            type: array
            items:
              type: string
        - name: orientations
          required: false
          in: query
          description: Comma-separated orientations.
          schema:
            type: array
            items:
              type: string
        - name: minDurationMs
          required: false
          in: query
          description: Minimum video duration in milliseconds.
          schema:
            type: number
        - name: maxDurationMs
          required: false
          in: query
          description: Maximum video duration in milliseconds.
          schema:
            type: number
        - name: usableOnly
          required: false
          in: query
          description: Include only usable videos (default true).
          schema:
            default: true
            type: boolean
        - name: usability
          required: false
          in: query
          description:
            Usable videos, unusable ones or all; wins over `usableOnly`
            (default usable).
          schema:
            type: string
            enum:
              - usable
              - unusable
              - all
        - name: limit
          required: false
          in: query
          description: Max items per page (default 40, max 100).
          schema:
            default: 40
            type: number
        - name: cursor
          required: false
          in: query
          description: Opaque pagination cursor.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Page number (1-based); wins over `cursor`.
          schema:
            type: number
        - name: sortBy
          required: false
          in: query
          description:
            relevance = text match (with `q`), quality and approval; folder /
            project = the first visible project of the video (by folder path, by
            name).
          schema:
            default: relevance
            type: string
            enum:
              - relevance
              - analyzedAt
              - quality
              - duration
              - resolution
              - name
              - folder
              - project
        - name: sortOrder
          required: false
          in: query
          schema:
            default: desc
            type: string
            enum:
              - asc
              - desc
      responses:

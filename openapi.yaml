      summary: Ghi nhận phụ lục đã ký (issued → signed), có hiệu lực từ effectiveDate
      tags: *a43
info:
  title: AG Go API
  description: AG Go backend API
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: http://localhost:3738/api
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        parentId:
          type: string
          format: uuid
        sortOrder:
          type: number
          minimum: 0
      required:
        - name
    UpdateFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        parentId:
          type: object
          format: uuid
          nullable: true
        sortOrder:
          type: number
          minimum: 0
    CreateAccessGrantsDto:
      type: object
      properties:
        principalId:
          type: string
        folderId:
          type: string
          format: uuid
        categoryIds:
          description: Danh mục; bỏ trống là mọi danh mục. Mỗi danh mục thành một quyền.
          type: array
          items:
            type: string
            format: uuid
        accessLevel:
          type: string
          enum: &a44
            - viewer
            - editor
            - manager
        inheritChildren:
          type: boolean
          default: true
      required:
        - principalId
        - folderId
        - accessLevel
    UpdateAccessGrantDto:
      type: object
      properties:
        accessLevel:
          type: string
          enum: *a44
        inheritChildren:
          type: boolean
    PreviewOriginalAccessBundleDto:
      type: object
      properties:
        folderIds:
          type: array
          items:
            type: string
            format: uuid
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - folderIds
        - categoryIds
    SaveOriginalAccessBundleDto:
      type: object
      properties:
        principalId:
          type: string
          description: Người nhận; bắt buộc khi tạo, bỏ qua khi sửa
        folderIds:
          description: Ít nhất một thư mục
          type: array
          items:
            type: string
            format: uuid
        categoryIds:
          description: Ít nhất một danh mục
          type: array
          items:
            type: string
            format: uuid
      required:
        - folderIds
        - categoryIds
    CreateCategoryDto:
      type: object
      properties: {}
    UpdateCategoryDto:
      type: object
      properties: {}
    CreateCountryDto:
      type: object
      properties: {}
    CreateProvinceDto:
      type: object
      properties: {}
    CreateTagDto:
      type: object
      properties: {}
    UpdateTagDto:
      type: object
      properties: {}
    CreateProjectDto:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        countryId:
          type: string
          format: uuid
        provinceId:
          type: string
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        tags:
          type: array
          items:
            type: string
      required:
        - folderId
        - name
        - categoryId
    UpdateProjectDto:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
        countryId:
          type: string
          format: uuid
          nullable: true
        provinceId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
    BackfillAnalysisDto:
      type: object
      properties:
        name:
          type: string
          description: Batch name shown in the batches list
        folderIds:
          description: Folder ids to backfill (includes subfolders)
          type: array
          items:
            type: string
        projectIds:
          description: Project ids to backfill
          type: array
          items:
            type: string
        mode:
          type: string
          enum:
            - missing
            - outdated
            - all
        priority:
          type: number
          default: 0
        dryRun:
          type: boolean
          default: false
      required:
        - mode
    Object:
      type: object
      properties: {}
    EnqueueAnalysisDto:
      type: object
      properties:
        priority:
          type: number
          default: 0
          description: Priority for this analysis job
    PrepBackfillDto:
      type: object
      properties:
        mode:
          type: string
          enum:
            - missing
            - all
        dryRun:
          type: boolean
          default: false
          description: Only count the footage that would be queued
      required:
        - mode
    CreateProjectMediaDto:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        assetType:
          type: string
          enum:
            - image
            - video
        originalFilename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          maxLength: 100
        fileSizeBytes:
          type: number
          minimum: 0
        extension:
          type: string
          maxLength: 20
        originalBucket:
          type: string
          maxLength: 100
        originalStorageKey:
          type: string
          maxLength: 500
        sortOrder:
          type: number
          minimum: 0
        caption:
          type: string
          maxLength: 500
    UpdateProjectMediaDto:
      type: object
      properties:
        sortOrder:
          type: number
          minimum: 0
        caption:
          type: string
          maxLength: 500
        evaluationStatus:
          type: string
          enum:
            - pending
            - approved
            - rejected
        comment:
          type: string
          maxLength: 2000
          nullable: true
    BulkApproveProjectMediaDto:
      type: object
      properties:
        mediaIds:
          maxItems: 1000
          type: array
          items:
            type: string
            format: uuid
        comment:
          type: string
          maxLength: 2000
          nullable: true
      required:
        - mediaIds
    BulkApproveProjectsDto:
      type: object
      properties:
        projectIds:
          maxItems: 100
          type: array
          items:
            type: string
            format: uuid
        overrideRejected:
          type: boolean
          default: false
          description:
            Also approve files currently rejected; otherwise only pending files
            change.
        comment:
          type: string
          maxLength: 2000
          nullable: true
      required:
        - projectIds
    ReorderProjectMediaDto:
      type: object
      properties:
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - mediaIds
    SetProjectThumbnailDto:
      type: object
      properties:
        projectMediaId:
          type: string
          format: uuid
          nullable: true
    CreateUploadSessionDto:
      type: object
      properties:
        assetType:
          type: string
          enum:
            - image
            - video
        originalFilename:
          type: string
          maxLength: 255
        extension:
          type: string
          maxLength: 20
        mimeType:
          type: string
          maxLength: 100
        fileSizeBytes:
          type: number
          minimum: 1
        expectedChecksumSha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        targetProjectId:
          type: string
          format: uuid
          description: Project that owns this uploaded asset
        uploadBatchId:
          type: string
          format: uuid
          description:
            Groups files uploaded together so the project audit log shows one
            entry per batch. Without it the file is logged on its own.
        fileLastModified:
          type: number
          description:
            The file’s last-modified time (File.lastModified, ms). With the
            name and size it tells the same file chosen again, so an unfinished
            large upload of it carries on instead of starting over.
      required:
        - assetType
        - originalFilename
        - mimeType
        - fileSizeBytes
        - targetProjectId
    UploadPartsDto:
      type: object
      properties:
        uploadSessionId:
          type: string
          format: uuid
        partNumbers:
          minItems: 1
          maxItems: 100
          description: Part numbers (1-based) to get presigned upload URLs for
          type: array
          items:
            type: number
      required:
        - uploadSessionId
        - partNumbers
    UploadClientMetricsDto:
      type: object
      properties:
        mode:
          type: string
          enum:
            - single
            - multipart
        transferMs:
          type: number
          description: Time spent sending the file content to storage, in ms
        partUrlWaitMs:
          type: number
          description: Time spent waiting for part URLs from the API, in ms
        partSize:
          type: number
        partCount:
          type: number
        parallelParts:
          type: number
        resumedBytes:
          type: number
          description:
            Bytes already in storage from an earlier attempt, so not sent this
            time
        retries:
          type: number
          description: Failed part attempts that were retried
        concurrentUploads:
          type: number
          description: Files uploading at the same time in the browser
        minMbps:
          type: number
          description: Slowest speed over ~1 s stretches that sent data, in Mbps
        maxMbps:
          type: number
          description: Fastest speed over ~1 s stretches that sent data, in Mbps
        idleMs:
          type: number
          description:
            Time in stretches where nothing was sent (waiting on storage or
            part URLs), in ms
        networkType:
          type: string
          description: navigator.connection.effectiveType (Chromium only)
        downlinkMbps:
          type: number
          description: navigator.connection.downlink in Mbps (Chromium only)
        rttMs:
          type: number
          description: navigator.connection.rtt in ms (Chromium only)
      required:
        - mode
        - transferMs
    CompleteUploadDto:
      type: object
      properties:
        uploadSessionId:
          type: string
          format: uuid
        checksumSha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        metrics:
          $ref: "#/components/schemas/UploadClientMetricsDto"
      required:
        - uploadSessionId
    UploadAttemptErrorDto:
      type: object
      properties:
        atMs:
          type: number
          description: When it failed, in ms since the transfer started
        partNumber:
          type: number
        httpStatus:
          type: number
          description: HTTP status; 0 when no response came back
        message:
          type: string
      required:
        - atMs
        - message
    UploadFailureDto:
      type: object
      properties:
        stage:
          type: string
          enum:
            - part-urls
            - transfer
            - complete
        message:
          type: string
        httpStatus:
          type: number
          description: HTTP status of the final error; 0 when no response came back
        partNumber:
          type: number
          description: Part that failed for good (multipart only)
        bytesSent:
          type: number
          description: Bytes sent before the failure
        partsDone:
          type: number
          description: Parts fully sent before the failure (multipart only)
        elapsedMs:
          type: number
          description: Time from the start of the transfer to the failure, in ms
        errors:
          description: The last failed requests, retried ones included (at most 10)
          type: array
          items:
            $ref: "#/components/schemas/UploadAttemptErrorDto"
      required:
        - stage
        - message
    AbortUploadDto:

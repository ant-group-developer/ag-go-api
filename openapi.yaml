      security: *a60
      summary:
        BBNT đã ký quá hạn thanh toán (hạn theo ngày làm việc, BR-34) còn phải
        trả, kèm số ngày quá hạn (FR-$-03, FR-R-05)
      tags: *a61
  /payments/export:
    get:
      operationId: PaymentsController_exportPayouts
      parameters:
        - name: partnerId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: contractId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: dueTo
          required: false
          in: query
          description: Chỉ BBNT có hạn thanh toán đến ngày này (gồm)
          schema:
            example: 2026-11-30
            type: string
        - name: reveal
          required: false
          in: query
          description:
            "true: số tài khoản, MST đầy đủ (cần go.partner.pii_read, ghi
            audit); mặc định che như màn hình"
          schema:
            type: boolean
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a60
      summary:
        "Xuất Excel danh sách chi trả cho kế toán (FR-$-05): BBNT đã ký còn
        phải trả, đối tác, MST, số tài khoản, ngân hàng (từ hồ sơ chụp khi phát
        hành), gộp / thuế / đối trừ / thực lĩnh / đã chi / còn lại / hạn. MST và
        STK bị che trừ khi reveal=true (cần go.partner.pii_read). Ghi audit"
      tags: *a61
  /payments/{id}:
    get:
      operationId: PaymentsController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a60
      summary: Chi tiết một khoản chi
      tags: *a61
  /payments/{id}/cancel:
    post:
      operationId: PaymentsController_cancel
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelPaymentDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a60
      summary: Huỷ khoản chi kèm lý do (không xoá). Chi trả BBNT huỷ → BBNT về
        partially_paid / signed; không huỷ được tạm ứng đã đối trừ ở BBNT đã
        phát hành (409 PAYMENT_ADVANCE_ALREADY_OFFSET). Ghi audit
      tags: *a61
  /payments/{id}/proof:
    post:
      operationId: PaymentsController_uploadProof
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: "Chứng từ chuyển khoản: PDF, JPG hoặc PNG, tối đa 10 MB"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a60
      summary: Upload chứng từ chuyển khoản (lưu R2, thay bản trước nếu có). Ghi audit
      tags: *a61
    get:
      operationId: PaymentsController_proof
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a60
      summary: Xem chứng từ chuyển khoản (inline, đọc từ R2 qua API). 404
        PAYMENT_PROOF_MISSING. Ghi audit
      tags: *a61
  /payment-reports/payables:
    get:
      operationId: PaymentReportsController_payables
      parameters:
        - name: partnerId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: contractId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: managerUserId
          required: false
          in: query
          description: Người phụ trách HĐ
          schema:
            type: string
        - name: from
          required: false
          in: query
          description: Từ ngày (gồm)
          schema:
            example: 2026-01-01
            type: string
        - name: to
          required: false
          in: query
          description: Đến ngày (gồm)
          schema:
            example: 2026-12-31
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: &a62
        - bearer: []
      summary:
        "Công nợ hiện tại theo HĐ và theo đối tác (sổ công nợ của nhiều HĐ):
        nghiệm thu, thuế, thực lĩnh, đã chi, tạm ứng, số dư tạm ứng, còn phải
        trả, quá hạn, % trần; capAlerts: HĐ đạt 80%/100% trần (FR-C-09,
        FR-R-05). from/to không áp dụng"
      tags: &a63
        - payment-reports
  /payment-reports/payments:
    get:
      operationId: PaymentReportsController_payments
      parameters:
        - name: partnerId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: contractId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: managerUserId
          required: false
          in: query
          description: Người phụ trách HĐ
          schema:
            type: string
        - name: from
          required: false
          in: query
          description: Từ ngày (gồm)
          schema:
            example: 2026-01-01
            type: string
        - name: to
          required: false
          in: query
          description: Đến ngày (gồm)
          schema:
            example: 2026-12-31
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a62
      summary:
        "Thanh toán theo kỳ (ngày chi trong from–to): tổng theo tháng và loại
        (tạm ứng, thanh toán BBNT, hoàn tạm ứng, chi ròng) và danh sách khoản
        chi (FR-R-01)"
      tags: *a63
  /payment-reports/acceptances:
    get:
      operationId: PaymentReportsController_acceptances
      parameters:
        - name: partnerId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: contractId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: managerUserId
          required: false
          in: query
          description: Người phụ trách HĐ
          schema:
            type: string
        - name: from
          required: false
          in: query
          description: Từ ngày (gồm)
          schema:
            example: 2026-01-01
            type: string
        - name: to
          required: false
          in: query
          description: Đến ngày (gồm)
          schema:
            example: 2026-12-31
            type: string
        - name: status
          required: false
          in: query
          description: Chỉ liệt kê BBNT ở trạng thái này
          schema:
            type: string
            enum:
              - draft
              - submitted
              - approved
              - issued
              - signed
              - partially_paid
              - paid
              - cancelled
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a62
      summary:
        "BBNT theo trạng thái (ngày lập trong from–to): số lượng, gộp, thuế,
        thực lĩnh, đã chi, còn phải trả theo trạng thái và danh sách (lọc
        status)"
      tags: *a63
  /payment-reports/tax:
    get:
      operationId: PaymentReportsController_tax
      parameters:
        - name: year
          required: true
          in: query
          description: Năm (theo ngày lập BBNT), FR-R-04
          schema:
            example: 2026
            type: number
        - name: partnerId
          required: false
          in: query
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a62
      summary:
        Thuế TNCN đã khấu trừ theo đối tác trong năm (BBNT đã phát hành, theo
        ngày lập), hỗ trợ quyết toán (FR-R-04)
      tags: *a63
  /payment-reports/export:
    get:
      operationId: PaymentReportsController_export
      parameters:
        - name: partnerId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: contractId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: managerUserId
          required: false
          in: query
          description: Người phụ trách HĐ
          schema:
            type: string
        - name: from
          required: false
          in: query
          description: Từ ngày (gồm)
          schema:
            example: 2026-01-01
            type: string
        - name: to
          required: false
          in: query
          description: Đến ngày (gồm)
          schema:
            example: 2026-12-31
            type: string
        - name: status
          required: false
          in: query
          description: Chỉ liệt kê BBNT ở trạng thái này
          schema:
            type: string
            enum:
              - draft
              - submitted
              - approved
              - issued
              - signed
              - partially_paid
              - paid
              - cancelled
        - name: report
          required: true
          in: query
          schema:
            type: string
            enum:
              - payables
              - payments
              - acceptances
              - tax
        - name: year
          required: false
          in: query
          description: Bắt buộc với report=tax
          schema:
            example: 2026
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a62
      summary:
        "Xuất Excel một báo cáo: report=payables (2 sheet: theo HĐ, theo đối
        tác) | payments (theo tháng, chi tiết) | acceptances (theo trạng thái,
        danh sách) | tax (cần year). Ghi audit"
      tags: *a63
info:
  title: AG Go API
  description: AG Go backend API
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: http://localhost:3738/api
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        parentId:
          type: string
          format: uuid
        sortOrder:
          type: number
          minimum: 0
      required:
        - name
    UpdateFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        parentId:
          type: object
          format: uuid
          nullable: true
        sortOrder:
          type: number
          minimum: 0
    CreateAccessGrantsDto:
      type: object
      properties:
        principalId:
          type: string
        folderId:
          type: string
          format: uuid
        categoryIds:
          description: Danh mục; bỏ trống là mọi danh mục. Mỗi danh mục thành một quyền.
          type: array
          items:
            type: string
            format: uuid
        accessLevel:
          type: string
          enum: &a64
            - viewer
            - editor
            - manager
        inheritChildren:
          type: boolean
          default: true
      required:
        - principalId
        - folderId
        - accessLevel
    UpdateAccessGrantDto:
      type: object
      properties:
        accessLevel:
          type: string
          enum: *a64
        inheritChildren:
          type: boolean
    PreviewOriginalAccessBundleDto:
      type: object
      properties:
        folderIds:
          type: array
          items:
            type: string
            format: uuid
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - folderIds
        - categoryIds
    SaveOriginalAccessBundleDto:
      type: object
      properties:
        principalId:
          type: string
          description: Người nhận; bắt buộc khi tạo, bỏ qua khi sửa
        folderIds:
          description: Ít nhất một thư mục
          type: array
          items:
            type: string
            format: uuid
        categoryIds:
          description: Ít nhất một danh mục
          type: array
          items:
            type: string
            format: uuid
      required:
        - folderIds
        - categoryIds
    CreateCategoryDto:
      type: object
      properties: {}
    UpdateCategoryDto:
      type: object
      properties: {}
    CreateCountryDto:
      type: object
      properties: {}
    CreateProvinceDto:
      type: object
      properties: {}
    CreateTagDto:
      type: object
      properties: {}
    UpdateTagDto:
      type: object
      properties: {}
    CreateProjectDto:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        countryId:
          type: string
          format: uuid
        provinceId:
          type: string
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        tags:
          type: array
          items:
            type: string
      required:
        - folderId
        - name
        - categoryId
    UpdateProjectDto:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
        countryId:
          type: string
          format: uuid
          nullable: true
        provinceId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
    BackfillAnalysisDto:
      type: object
      properties:
        name:
          type: string
          description: Batch name shown in the batches list
        folderIds:
          description: Folder ids to backfill (includes subfolders)
          type: array
          items:
            type: string
        projectIds:
          description: Project ids to backfill
          type: array
          items:
            type: string
        mode:
          type: string
          enum:
            - missing
            - outdated
            - all
        priority:
          type: number
          default: 0
        dryRun:
          type: boolean
          default: false
      required:
        - mode
    Object:
      type: object
      properties: {}
    EnqueueAnalysisDto:
      type: object
      properties:
        priority:
          type: number
          default: 0
          description: Priority for this analysis job
    PrepBackfillDto:
      type: object
      properties:
        mode:
          type: string
          enum:
            - missing
            - all
        dryRun:
          type: boolean
          default: false
          description: Only count the footage that would be queued
      required:
        - mode
    UpdateProjectContractDto:
      type: object
      properties:
        contractId:
          type: object
          format: uuid
          nullable: true
          description:
            HĐ active của đúng đối tác sở hữu project (FR-C-08); null = bỏ gắn;
            bỏ trống = giữ nguyên
        deliveredAt:
          type: string
          example: 2026-09-14T10:00:00+07:00
          description:
            Sửa thời điểm giao (mặc định là lần đầu project chuyển "pending");
            cần go.contract.manage
        acceptedOutside:
          type: boolean
          description:
            'Đánh dấu / bỏ đánh dấu "đã nghiệm thu ngoài hệ thống" (mục 15.3):
            không kiểm tra, không tính lại; cần go.contract.manage'
        acceptedOutsideNote:
          type: object
          nullable: true
          description: Ghi chú, vd. số BBNT giấy
    CreateContractDto:
      type: object
      properties:
        contractType:
          type: string
          enum: &a65
            - content_production
          default: content_production
        contractNumber:
          type: string
          description:
            Bỏ trống = tự sinh DDMMYY/HĐSXND/AG-<mã> (BR-05); sửa được khi còn
            nháp
          example: 010826/HĐSXND/AG-NHH
        signedDate:
          type: object
          example: 2026-08-01
          description: Ngày ký (bắt buộc khi kích hoạt)
        endDate:
          type: object
          example: 2026-08-01
          nullable: true
        capAmount:
          type: object
          description: Trần giá trị HĐ (đồng); null = không trần
          nullable: true
        advanceAmount:
          type: number
          default: 0
        advanceDueBusinessDays:
          type: object
          description: Hạn tạm ứng (ngày làm việc), bắt buộc khi có tạm ứng
        advanceOffsetRule:
          type: string
          enum: &a66
            - full_first
            - proportional
          default: full_first
        deliveryRule:
          type: object
          description:
            '{ "type": "monthly_before_day", "day": 15 } hoặc { "type":
            "flexible" }'
          additionalProperties: true
          nullable: true
        techSpec:
          type: object
          description: Tech spec (đặc tả 8.1); bỏ trống khi tạo = preset techSpecPreset
          additionalProperties: true
        techSpecPreset:
          type: string
          enum: &a67
            - footage_4k60
            - topic_video
            - shot_4k
          default: footage_4k60
        penaltyPercent:
          type: number
          default: 8
        originalityMinPercent:
          type: object
          nullable: true
          example: 70
        similarityMaxPercent:
          type: object
          nullable: true
          default: 30
        nonCompeteMonths:
          type: object
          nullable: true
          default: 24
        templateVersionId:
          type: object
          format: uuid
          nullable: true
        managerUserId:
          type: string
          description: Người phụ trách; mặc định của đối tác
        note:
          type: object
          nullable: true
        partnerId:
          type: string
          format: uuid
        startDate:
          type: string
          example: 2026-08-01
        pricingModel:
          type: string
          enum: &a68
            - per_topic
            - per_unit
            - package_tier
        pricingConfig:
          type: object
          description:
            "Cấu hình giá theo mô hình (đặc tả 7.2): per_topic / per_unit /
            package_tier"
          additionalProperties: true
        acceptanceCycle:
          type: string
          enum: &a69
            - on_demand
            - weekly
            - monthly
        paymentTermBusinessDays:
          type: number
          example: 10
          description: Hạn thanh toán (ngày làm việc)
      required:
        - partnerId
        - startDate
        - pricingModel
        - pricingConfig
        - acceptanceCycle
        - paymentTermBusinessDays
    UpdateContractDto:
      type: object
      properties:
        contractType:
          type: string
          enum: *a65
          default: content_production
        contractNumber:
          type: string
          description:
            Bỏ trống = tự sinh DDMMYY/HĐSXND/AG-<mã> (BR-05); sửa được khi còn
            nháp
          example: 010826/HĐSXND/AG-NHH
        signedDate:
          type: object
          example: 2026-08-01
          description: Ngày ký (bắt buộc khi kích hoạt)
        endDate:
          type: object
          example: 2026-08-01
          nullable: true
        capAmount:
          type: object
          description: Trần giá trị HĐ (đồng); null = không trần
          nullable: true
        advanceAmount:
          type: number
          default: 0
        advanceDueBusinessDays:
          type: object
          description: Hạn tạm ứng (ngày làm việc), bắt buộc khi có tạm ứng
        advanceOffsetRule:
          type: string
          enum: *a66
          default: full_first
        deliveryRule:
          type: object
          description:
            '{ "type": "monthly_before_day", "day": 15 } hoặc { "type":
            "flexible" }'
          additionalProperties: true
          nullable: true
        techSpec:
          type: object
          description: Tech spec (đặc tả 8.1); bỏ trống khi tạo = preset techSpecPreset
          additionalProperties: true
        techSpecPreset:
          type: string
          enum: *a67
          default: footage_4k60
        penaltyPercent:
          type: number
          default: 8
        originalityMinPercent:
          type: object
          nullable: true
          example: 70
        similarityMaxPercent:
          type: object
          nullable: true
          default: 30
        nonCompeteMonths:
          type: object
          nullable: true
          default: 24
        templateVersionId:
          type: object
          format: uuid
          nullable: true
        managerUserId:
          type: string
          description: Người phụ trách; mặc định của đối tác
        note:
          type: object
          nullable: true
        startDate:
          type: string
          example: 2026-08-01
        pricingModel:
          type: string
          enum: *a68
        pricingConfig:
          type: object
          additionalProperties: true
        acceptanceCycle:
          type: string
          enum: *a69
        paymentTermBusinessDays:
          type: number
          example: 10
        regenerateNumber:
          type: boolean
          description:
            Sinh lại số HĐ theo ngày ký / ngày bắt đầu mới (khi không gửi
            contractNumber)
    ActivateContractDto:
      type: object
      properties:
        signedDate:
          type: string
          example: 2026-08-01
          description: Ngày ký; bắt buộc nếu HĐ chưa có
        signedFileId:
          type: string
          format: uuid
          description: Bản ký đã upload
        skipSignedFileReason:
          type: string
          description: "Quản trị kích hoạt khi chưa có bản ký: bắt buộc nêu lý do (FR-C-06)"
    ContractReasonDto:
      type: object
      properties:
        reason:
          type: string
    TerminateContractDto:
      type: object
      properties:
        reason:
          type: string
          description: Lý do chấm dứt / thanh lý (FR-C-10)
      required:
        - reason
    AmendmentChangesDto:
      type: object
      properties:

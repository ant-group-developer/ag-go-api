            default: 20
            type: number
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a40
      summary:
        Tìm user AG Account thuộc ứng dụng AG Go để thêm làm đối tác (id, tên,
        email, goUserId, partnerId nếu đã là đối tác)
      tags: *a41
  /partners/{id}:
    get:
      operationId: PartnersController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a40
      summary:
        "Đối tác (bản ghi AG Go, trạng thái hồ sơ lần kiểm gần nhất). Hồ sơ AG
        Account: GET /partners/:id/profile"
      tags: *a41
    patch:
      operationId: PartnersController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartnerDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a40
      summary: Sửa mã, người phụ trách, trạng thái, ghi chú
      tags: *a41
  /partners/{id}/profile:
    get:
      operationId: PartnersController_getProfile
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: reveal
          required: false
          in: query
          description: pii = trả giá trị đầy đủ (cần go.partner.pii_read, ghi audit)
          schema:
            type: string
            enum:
              - pii
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a40
      summary:
        "Hồ sơ hợp đồng từ AG Account: đã che, hoặc đầy đủ với ?reveal=pii (cần
        go.partner.pii_read). Mỗi lần xem ghi audit PARTNER_PROFILE_VIEWED."
      tags: *a41
    patch:
      operationId: PartnersController_updateProfile
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartnerProfileDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a40
      summary:
        "Sửa một phần hồ sơ ở AG Account (PATCH + If-Match = version). 409
        CONTRACT_PROFILE_VERSION_CONFLICT khi hồ sơ đã đổi: tải lại."
      tags: *a41
  /contracts:
    get:
      operationId: ContractsController_list
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: pageSize
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: keyword
          required: false
          in: query
          schema:
            maxLength: 200
            type: string
        - name: partnerId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - draft
              - issued
              - active
              - suspended
              - completed
              - terminated
        - name: pricingModel
          required: false
          in: query
          schema:
            type: string
            enum:
              - per_topic
              - per_unit
              - package_tier
        - name: managerUserId
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: &a42
        - bearer: []
      summary:
        "Danh sách HĐ (lọc đối tác, trạng thái, mô hình giá, người phụ trách).
        Không có go.contract.read_all: chỉ HĐ mình phụ trách."
      tags: &a43
        - contracts
    post:
      operationId: ContractsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Tạo HĐ nháp (cấu hình giá kiểm theo mô hình, FR-C-01)
      tags: *a43
  /contracts/tech-spec-presets:
    get:
      operationId: ContractsController_techSpecPresets
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Preset tech spec (FR-C-03), vd. Footage 4K60
      tags: *a43
  /contracts/next-number:
    get:
      operationId: ContractsController_nextNumber
      parameters:
        - name: partnerId
          required: true
          in: query
          schema:
            format: uuid
            type: string
        - name: date
          required: true
          in: query
          description: Ngày ký dự kiến
          schema:
            example: 2026-08-01
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Số HĐ sẽ cấp cho đối tác và ngày ký (BR-05)
      tags: *a43
  /contracts/import:
    post:
      operationId: ContractsController_importCsv
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary:
        "Nhập HĐ cũ từ CSV (FR-C-11), tất cả hoặc không. Cột: partner_code,
        contract_number, signed_date, start_date, end_date, status,
        pricing_model, pricing_config, acceptance_cycle,
        payment_term_business_days, cap_amount, advance_amount,
        advance_due_business_days, last_appendix_number, legacy_accepted_amount,
        legacy_paid_amount, legacy_advance_balance, note"
      tags: *a43
  /contracts/{id}:
    get:
      operationId: ContractsController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Chi tiết HĐ kèm phụ lục sửa đổi và các thao tác được phép
      tags: *a43
    patch:
      operationId: ContractsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContractDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary:
        "Sửa HĐ: điều khoản chỉ khi nháp (409 CONTRACT_TERMS_LOCKED sau đó,
        dùng phụ lục); người phụ trách, ghi chú lúc nào cũng sửa được"
      tags: *a43
    delete:
      operationId: ContractsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Xoá HĐ nháp
      tags: *a43
  /contracts/{id}/terms:
    get:
      operationId: ContractsController_terms
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: date
          required: false
          in: query
          description: Mặc định hôm nay
          schema:
            example: 2026-09-30
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Điều khoản hiệu lực tại một ngày (áp các phụ lục đã ký)
      tags: *a43
  /contracts/{id}/issue:
    post:
      operationId: ContractsController_issue
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: "Phát hành: đọc hồ sơ AG Account, chụp snapshot mã hoá; 422
        PARTNER_PROFILE_INCOMPLETE nếu thiếu trường"
      tags: *a43
  /contracts/{id}/unissue:
    post:
      operationId: ContractsController_unissue
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Huỷ phát hành, về nháp để sửa
      tags: *a43
  /contracts/{id}/activate:
    post:
      operationId: ContractsController_activate
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateContractDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary:
        "Kích hoạt: cần ngày ký và bản ký (quản trị bỏ qua bản ký được nếu nêu
        lý do)"
      tags: *a43
  /contracts/{id}/suspend:
    post:
      operationId: ContractsController_suspend
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractReasonDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Tạm dừng HĐ đang hiệu lực
      tags: *a43
  /contracts/{id}/resume:
    post:
      operationId: ContractsController_resume
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Tiếp tục HĐ đang tạm dừng
      tags: *a43
  /contracts/{id}/complete:
    post:
      operationId: ContractsController_complete
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Hoàn thành (đủ nghĩa vụ / chạm trần)
      tags: *a43
  /contracts/{id}/terminate:
    post:
      operationId: ContractsController_terminate
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminateContractDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Chấm dứt / thanh lý, bắt buộc lý do (FR-C-10)
      tags: *a43
  /contracts/{id}/amendments:
    get:
      operationId: ContractsController_listAmendments
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Phụ lục sửa đổi của HĐ
      tags: *a43
    post:
      operationId: ContractsController_createAmendment
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAmendmentDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Tạo phụ lục sửa đổi nháp (HĐ active / suspended, FR-C-07)
      tags: *a43
  /contracts/{id}/amendments/{amendmentId}:
    patch:
      operationId: ContractsController_updateAmendment
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: amendmentId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAmendmentDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Sửa phụ lục nháp
      tags: *a43
    delete:
      operationId: ContractsController_removeAmendment
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: amendmentId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Xoá phụ lục nháp
      tags: *a43
  /contracts/{id}/amendments/{amendmentId}/issue:
    post:
      operationId: ContractsController_issueAmendment
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: amendmentId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security: *a42
      summary: Phát hành phụ lục (draft → issued)
      tags: *a43
  /contracts/{id}/amendments/{amendmentId}/sign:
    post:
      operationId: ContractsController_signAmendment
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: amendmentId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignAmendmentDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

          required: false
          in: query
          description: Comma-separated category IDs; matches any.
          schema:
            type: array
            items:
              type: string
        - name: tagIds
          required: false
          in: query
          description: Comma-separated tag IDs; matches any.
          schema:
            type: array
            items:
              type: string
        - name: evaluationStatuses
          required: false
          in: query
          description: Comma-separated evaluation statuses; matches any.
          schema:
            type: array
            items:
              type: string
              enum:
                - draft
                - pending
                - completed
                - partially_completed
                - failed
        - name: ownerUserIds
          required: false
          in: query
          description: Comma-separated user IDs of project owners (authors); matches any.
          schema:
            type: array
            items:
              type: string
        - name: mine
          required: false
          in: query
          description: Only projects owned by the current user.
          schema:
            type: boolean
      responses:
        "200":

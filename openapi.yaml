info:
  title: AG Go API
  description: AG Go backend API
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: http://localhost:3737/api
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        parentId:
          type: string
          format: uuid
        sortOrder:
          type: number
          minimum: 0
      required:
        - name
    UpdateFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        parentId:
          type: object
          format: uuid
          nullable: true
        sortOrder:
          type: number
          minimum: 0
    SetFolderGrantDto:
      type: object
      properties:
        accessLevel:
          type: string
          enum:
            - viewer
            - editor
            - manager
        inheritChildren:
          type: boolean
          default: true
      required:
        - accessLevel
    CreateCategoryDto:
      type: object
      properties: {}
    UpdateCategoryDto:
      type: object
      properties: {}
    CreateCountryDto:
      type: object
      properties: {}
    CreateProvinceDto:
      type: object
      properties: {}
    CreateTagDto:
      type: object
      properties: {}
    UpdateTagDto:
      type: object
      properties: {}
    CreateProjectDto:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        countryId:
          type: string
          format: uuid
        provinceId:
          type: string
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        tags:
          type: array
          items:
            type: string
      required:
        - folderId
        - name
    UpdateProjectDto:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        countryId:
          type: string
          format: uuid
          nullable: true
        provinceId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
    BackfillAnalysisDto:
      type: object
      properties:
        folderIds:
          description: Folder ids to backfill (includes subfolders)
          type: array
          items:
            type: string
        projectIds:
          description: Project ids to backfill
          type: array
          items:
            type: string
        mode:
          type: string
          enum:
            - missing
            - outdated
            - all
        priority:
          type: number
          default: 0
        dryRun:
          type: boolean
          default: false
      required:
        - mode
    EnqueueAnalysisDto:
      type: object
      properties:
        priority:
          type: number
          default: 0
          description: Priority for this analysis job
    CreateProjectMediaDto:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        assetType:
          type: string
          enum:
            - image
            - video
        originalFilename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          maxLength: 100
        fileSizeBytes:
          type: number
          minimum: 0
        extension:
          type: string
          maxLength: 20
        originalBucket:
          type: string
          maxLength: 100
        originalStorageKey:
          type: string
          maxLength: 500
        sortOrder:
          type: number
          minimum: 0
        caption:
          type: string
          maxLength: 500
    UpdateProjectMediaDto:
      type: object
      properties:
        sortOrder:
          type: number
          minimum: 0
        caption:
          type: string
          maxLength: 500
        evaluationStatus:
          type: string
          enum:
            - pending
            - approved
            - rejected
        comment:
          type: string
          maxLength: 2000
          nullable: true
    BulkApproveProjectMediaDto:
      type: object
      properties:
        mediaIds:
          maxItems: 1000
          type: array
          items:
            type: string
            format: uuid
        comment:
          type: string
          maxLength: 2000
          nullable: true
      required:
        - mediaIds
    BulkApproveProjectsDto:
      type: object
      properties:
        projectIds:
          maxItems: 100
          type: array
          items:
            type: string
            format: uuid
        overrideRejected:
          type: boolean
          default: false
          description:
            Also approve files currently rejected; otherwise only pending files
            change.
        comment:
          type: string
          maxLength: 2000
          nullable: true
      required:
        - projectIds
    ReorderProjectMediaDto:
      type: object
      properties:
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - mediaIds
    SetProjectThumbnailDto:
      type: object
      properties:
        projectMediaId:
          type: string
          format: uuid
          nullable: true
    CreateUploadSessionDto:
      type: object
      properties:
        assetType:
          type: string
          enum:
            - image
            - video
        originalFilename:
          type: string
          maxLength: 255
        extension:
          type: string
          maxLength: 20
        mimeType:
          type: string
          maxLength: 100
        fileSizeBytes:
          type: number
          minimum: 1
        expectedChecksumSha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        targetProjectId:
          type: string
          format: uuid
          description: Project that owns this uploaded asset
        uploadBatchId:
          type: string
          format: uuid
          description:
            Groups files uploaded together so the project audit log shows one
            entry per batch. Without it the file is logged on its own.
      required:
        - assetType
        - originalFilename
        - mimeType
        - fileSizeBytes
        - targetProjectId
    UploadPartsDto:
      type: object
      properties:
        uploadSessionId:
          type: string
          format: uuid
        partNumbers:
          minItems: 1
          maxItems: 100
          description: Part numbers (1-based) to get presigned upload URLs for
          type: array
          items:
            type: number
      required:
        - uploadSessionId
        - partNumbers
    CompleteUploadDto:
      type: object
      properties:
        uploadSessionId:
          type: string
          format: uuid
        checksumSha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
      required:
        - uploadSessionId
    AbortUploadDto:
      type: object
      properties:
        uploadSessionId:
          type: string
          format: uuid
      required:
        - uploadSessionId
    UpdateRenderProfileDto:
      type: object
      properties: {}
    CreateWatermarkLogoUploadSessionDto:
      type: object
      properties:
        originalFilename:
          type: string
          maxLength: 255
        extension:
          type: string
          maxLength: 20
        fileSizeBytes:
          type: number
          minimum: 1
        expectedChecksumSha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        uploadBatchId:
          type: string
          format: uuid
          description:
            Groups files uploaded together so the project audit log shows one
            entry per batch. Without it the file is logged on its own.
        mimeType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
      required:
        - originalFilename
        - fileSizeBytes
        - mimeType
    CreateRenderBatchDto:
      type: object
      properties: {}
    RerenderWatermarkDto:
      type: object
      properties: {}
    CreateDownloadDto:
      type: object
      properties: {}
    SummarizeSourceDto:
      type: object
      properties:
        fileId:
          type: string
        driveId:
          type: string
      required:
        - fileId
    SummarizeSourcesDto:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SummarizeSourceDto"
      required:
        - projectId
        - sources
    GoogleDriveImportSourceDto:
      type: object
      properties:
        fileId:
          type: string
        driveId:
          type: string
        name:
          type: string
        mimeType:
          type: string
      required:
        - fileId
    CreateImportDto:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        sourceRootId:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/GoogleDriveImportSourceDto"
        sourceDriveId:
          type: string
        idempotencyKey:
          type: string
        duplicatePolicy:
          type: string
          enum:
            - create_new
            - reuse_existing
            - overwrite_existing
          default: reuse_existing
      required:
        - projectId
    UpdateSettingsDto:
      type: object
      properties: {}
    CatalogFiltersDto:
      type: object
      properties:
        usableOnly:
          type: boolean
          description: Include only usable segments (default true).
        minQuality:
          type: number
          description: Minimum quality score (0–5).
        orientations:
          description: Comma-separated orientations.
          type: array
          items:
            type: string
        shotSizes:
          description: Comma-separated shot sizes.
          type: array
          items:
            type: string
        q:
          type: string
          description: Free-text search within captions/tags.
    FootageCatalogBodyDto:
      type: object
      properties:
        folderIds:
          description:
            Folder IDs to scope. Each must be within the user scope, else 404.
            1–50.
          type: array
          items:
            type: string
        filters:
          $ref: "#/components/schemas/CatalogFiltersDto"
        limit:
          type: number
          description: Max items to return (default 500, max 1000).
          default: 500
        cursor:
          type: string
          description: Opaque pagination cursor from the previous response.
    ResolveSegmentsDto:
      type: object
      properties:
        segmentIds:
          description: Segment IDs to resolve (1–500).
          type: array
          items:
            type: string
        purpose:
          type: string
          enum:
            - preview
            - final
      required:
        - segmentIds
        - purpose
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ApiResponse:
      type: object
      required:
        - data
        - requestId
        - timestamp
        - success
        - error
      properties:
        data: {}
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        success:
          type: boolean
        error:
          allOf:
            - $ref: "#/components/schemas/ApiError"
          nullable: true
    ListResponse:
      type: object
      required:
        - items
        - page
        - pageSize
        - total
        - totalPages
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    CursorListResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
          nullable: true
    Asset:
      type: object
      required:
        - id
        - assetType
        - originalFilename
        - mimeType
        - fileSizeBytes
        - processingStatus
      properties:
        id:
          type: string
          format: uuid
        assetType:
          type: string
          enum:
            - image
            - video
        originalFilename:
          type: string
        mimeType:
          type: string
        fileSizeBytes:
          type: string
        processingStatus:
          type: string
        processingError:
          type: string
          nullable: true
        sourceMetadata:
          type: object
          additionalProperties: true
    ProjectMedia:
      type: object
      required:
        - id
        - projectId
        - assetId
        - sortOrder
        - evaluationStatus
        - asset
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        sortOrder:
          type: integer
        caption:
          type: string
          nullable: true
        evaluationStatus:
          type: string
          enum:
            - pending
            - approved
            - rejected
        durationSeconds:
          type: number
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        asset:
          $ref: "#/components/schemas/Asset"
    Project:
      type: object
      required:
        - id
        - name
        - folderId
        - evaluationStatus
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        folderId:
          type: string
          format: uuid
        evaluationStatus:
          type: string
          enum:
            - draft
            - pending
            - completed
            - partially_completed
            - failed
        mediaCount:
          type: integer
          minimum: 0
        imageCount:
          type: integer
          minimum: 0
        videoCount:
          type: integer
          minimum: 0
        originalBytes:
          type: string
        renderedBytes:
          type: string
    EvaluationHistory:
      type: object
      required:
        - id
        - projectMediaId
        - evaluationStatus
        - evaluatedBy
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        projectMediaId:
          type: string
          format: uuid
        evaluationStatus:
          type: string
          enum:
            - pending
            - approved
            - rejected
        comment:
          type: string
          nullable: true
        evaluatedBy:
          type: string
        createdAt:
          type: string
          format: date-time

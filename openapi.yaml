          description: Max items per page (default 40, max 100).
          schema:
            default: 40
            type: number
        - name: cursor
          required: false
          in: query
          description: Opaque pagination cursor.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Page number (1-based); wins over `cursor`.
          schema:
            type: number
        - name: sortBy
          required: false
          in: query
          description:
            relevance = text match (with `q`), quality and approval; folder /
            project = the first visible project of the video (by folder path, by
            name).
          schema:
            default: relevance
            type: string
            enum:
              - relevance
              - analyzedAt
              - quality
              - duration
              - resolution
              - name
              - folder
              - project
        - name: sortOrder
          required: false
          in: query
          schema:
            default: desc
            type: string
            enum:
              - asc
              - desc
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - *a38
        - service-key: []
      summary: Full-text + trigram search across analysed videos
      tags: *a39
  /footage/facets:
    get:
      operationId: FootageController_getFacets
      parameters:
        - name: q
          required: false
          in: query
          description: Free-text search query.
          schema:
            type: string
        - name: folderIds
          required: false
          in: query
          description:
            Comma-separated folder IDs (subfolders the user can reach are
            included).
          schema:
            type: array
            items:
              type: string
        - name: categoryIds
          required: false
          in: query
          description: Comma-separated category IDs.
          schema:
            type: array
            items:
              type: string
        - name: projectIds
          required: false
          in: query
          description: Comma-separated project IDs.
          schema:
            type: array
            items:
              type: string
        - name: ownerUserIds
          required: false
          in: query
          description: Comma-separated user IDs of project owners (authors).
          schema:
            type: array
            items:
              type: string
        - name: resolutions
          required: false
          in: query
          description: Comma-separated resolution classes (by the short edge of the frame).
          schema:
            type: array
            items:
              type: string
              enum:
                - 4k
                - 2k
                - 1080p
                - 720p
                - sd
        - name: tags
          required: false
          in: query
          description: Comma-separated tag values.
          schema:
            type: array
            items:
              type: string
        - name: provinceIds
          required: false
          in: query
          description: Comma-separated province IDs.
          schema:
            type: array
            items:
              type: string
        - name: genres
          required: false
          in: query
          description: Comma-separated genres.
          schema:
            type: array
            items:
              type: string
        - name: timesOfDay
          required: false
          in: query
          description: Comma-separated times of day.
          schema:
            type: array
            items:
              type: string
        - name: orientations
          required: false
          in: query
          description: Comma-separated orientations.
          schema:
            type: array
            items:
              type: string
        - name: minDurationMs
          required: false
          in: query
          description: Minimum video duration in milliseconds.
          schema:
            type: number
        - name: maxDurationMs
          required: false
          in: query
          description: Maximum video duration in milliseconds.
          schema:
            type: number
        - name: usableOnly
          required: false
          in: query
          description: Include only usable videos (default true).
          schema:
            default: true
            type: boolean
        - name: usability
          required: false
          in: query
          description:
            Usable videos, unusable ones or all; wins over `usableOnly`
            (default usable).
          schema:
            type: string
            enum:
              - usable
              - unusable
              - all
        - name: limit
          required: false
          in: query
          description: Max items per page (default 40, max 100).
          schema:
            default: 40
            type: number
        - name: cursor
          required: false
          in: query
          description: Opaque pagination cursor.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: Page number (1-based); wins over `cursor`.
          schema:
            type: number
        - name: sortBy
          required: false
          in: query
          description:
            relevance = text match (with `q`), quality and approval; folder /
            project = the first visible project of the video (by folder path, by
            name).
          schema:
            default: relevance
            type: string
            enum:
              - relevance
              - analyzedAt
              - quality
              - duration
              - resolution
              - name
              - folder
              - project
        - name: sortOrder
          required: false
          in: query
          schema:
            default: desc
            type: string
            enum:
              - asc
              - desc
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - *a38
        - service-key: []
      summary: Facet counts for search filters
      tags: *a39
  /usage/studio-events:
    post:
      operationId: StudioUsageController_record
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioUsageEventsDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - service-key: []
      summary: Footage usage events from AG Studio (service key only)
      tags: &a40
        - usage
  /footage/assets/{assetId}/studio-usage:
    get:
      operationId: StudioUsageController_assetUsage
      parameters:
        - name: assetId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - bearer: []
      summary: How AG Studio used one footage, and its downloads
      tags: *a40
  /projects/{projectId}/studio-usage:
    get:
      operationId: StudioUsageController_projectUsage
      parameters:
        - name: projectId
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - bearer: []
      summary: How AG Studio used a project's footage, and their downloads
      tags: *a40
  /system/workers:
    get:
      operationId: WorkersController_list
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - bearer: []
      summary: Worker processes on every host, with the commit they run (admins only)
      tags:
        - system
info:
  title: AG Go API
  description: AG Go backend API
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: http://localhost:37377/api
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        parentId:
          type: string
          format: uuid
        sortOrder:
          type: number
          minimum: 0
      required:
        - name
    UpdateFolderDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        parentId:
          type: object
          format: uuid
          nullable: true
        sortOrder:
          type: number
          minimum: 0
    CreateAccessGrantsDto:
      type: object
      properties:
        principalId:
          type: string
        folderId:
          type: string
          format: uuid
        categoryIds:
          description: Danh mục; bỏ trống là mọi danh mục. Mỗi danh mục thành một quyền.
          type: array
          items:
            type: string
            format: uuid
        accessLevel:
          type: string
          enum: &a41
            - viewer
            - editor
            - manager
        inheritChildren:
          type: boolean
          default: true
      required:
        - principalId
        - folderId
        - accessLevel
    UpdateAccessGrantDto:
      type: object
      properties:
        accessLevel:
          type: string
          enum: *a41
        inheritChildren:
          type: boolean
    PreviewOriginalAccessBundleDto:
      type: object
      properties:
        folderIds:
          type: array
          items:
            type: string
            format: uuid
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - folderIds
        - categoryIds
    SaveOriginalAccessBundleDto:
      type: object
      properties:
        principalId:
          type: string
          description: Người nhận; bắt buộc khi tạo, bỏ qua khi sửa
        folderIds:
          description: Ít nhất một thư mục
          type: array
          items:
            type: string
            format: uuid
        categoryIds:
          description: Ít nhất một danh mục
          type: array
          items:
            type: string
            format: uuid
      required:
        - folderIds
        - categoryIds
    AccountApplicationDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        description:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        visibility:
          type: string
        is_active:
          type: boolean
      required:
        - id
        - name
        - code
    CreateCategoryDto:
      type: object
      properties: {}
    UpdateCategoryDto:
      type: object
      properties: {}
    CountryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          nullable: true
        name:
          type: string
        flagUrl:
          type: string
          nullable: true
        sortOrder:
          type: number
        isActive:
          type: boolean
      required:
        - id
        - name
        - sortOrder
        - isActive
    CreateCountryDto:
      type: object
      properties: {}
    ProvinceCountryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
          nullable: true
      required:
        - id
        - name
    ProvinceDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        countryId:
          type: string
          format: uuid
        country:
          $ref: "#/components/schemas/ProvinceCountryDto"
        code:
          type: string
          nullable: true
        name:
          type: string
        sortOrder:
          type: number
        isActive:
          type: boolean
      required:
        - id
        - countryId
        - name
        - sortOrder
        - isActive
    ProvinceListResponseDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProvinceDto"
        page:
          type: number
        pageSize:
          type: number
        total:
          type: number
        totalPages:
          type: number
      required:
        - items
        - page
        - pageSize
        - total
        - totalPages
    CreateProvinceDto:
      type: object
      properties: {}
    TagActorDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
      required:
        - id
    TagDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        normalizedName:
          type: string
        createdBy:
          type: string
        createdByUser:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/TagActorDto"
        createdAt:
          type: object
          nullable: true
          format: date-time
        updatedAt:
          type: object
          nullable: true
          format: date-time
      required:
        - id
        - name
    CreateTagDto:
      type: object
      properties: {}
    UpdateTagDto:
      type: object
      properties: {}
    ProjectOwnerUserDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
      required:
        - id
    ProjectDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        folderId:
          type: string
          format: uuid
        folderName:
          type: string
          nullable: true
        folderPath:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
          format: uuid
        categoryName:
          type: string
          nullable: true
        countryId:
          type: string
          nullable: true
          format: uuid
        countryName:
          type: string
          nullable: true
        countryFlagUrl:
          type: string
          nullable: true
        provinceId:
          type: string
          nullable: true
          format: uuid
        provinceName:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        evaluationStatus:
          type: string
          enum:
            - draft
            - pending
            - completed
            - partially_completed
            - failed
        mediaCount:
          type: number
        imageCount:
          type: number
        videoCount:
          type: number
        originalBytes:
          type: string
        renderedBytes:
          type: string
        thumbnailProjectMediaId:
          type: string
          nullable: true
          format: uuid
        thumbnailAssetId:
          type: string
          nullable: true
          format: uuid
        thumbnailSource:
          type: string
          nullable: true
          enum:
            - manual
            - auto
        ownerUserId:
          type: string
        ownerUser:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/ProjectOwnerUserDto"
        tagIds:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - folderId
        - name
        - evaluationStatus
        - mediaCount
        - imageCount
        - videoCount
        - ownerUserId
        - createdAt
        - updatedAt
    ProjectPageDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDto"
        page:
          type: number
        pageSize:
          type: number
        total:
          type: number
        totalPages:
          type: number
      required:
        - items
        - page
        - pageSize
        - total
        - totalPages
    CreateProjectDto:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
        categoryId:
          type: string
          format: uuid
        countryId:
          type: string
          format: uuid
        provinceId:
          type: string
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        tags:
          type: array
          items:
            type: string
      required:
        - folderId
        - name
        - categoryId
    UpdateProjectDto:
      type: object
      properties:
        folderId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
        countryId:
          type: string
          format: uuid
          nullable: true
        provinceId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
    BackfillAnalysisDto:
      type: object
      properties:
        name:
          type: string
          description: Batch name shown in the batches list
        folderIds:
          description: Folder ids to backfill (includes subfolders)
          type: array
          items:
            type: string
        projectIds:
          description: Project ids to backfill
          type: array
          items:
            type: string
        mode:
          type: string
          enum:
            - missing
            - outdated
            - all
        priority:
          type: number
          default: 0
        dryRun:
          type: boolean
          default: false
      required:
        - mode
    Object:
      type: object
      properties: {}
    EnqueueAnalysisDto:
      type: object
      properties:
        priority:
          type: number
          default: 0
          description: Priority for this analysis job
    PrepBackfillDto:
      type: object
      properties:
        mode:
          type: string
          enum:
            - missing
            - all
        dryRun:
          type: boolean
          default: false
          description: Only count the footage that would be queued
      required:
        - mode
    CreateProjectMediaDto:
      type: object
      properties:
        assetId:
          type: string
          format: uuid
        assetType:
          type: string
          enum:
            - image
            - video
        originalFilename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          maxLength: 100
        fileSizeBytes:
          type: number
          minimum: 0
        extension:
          type: string
          maxLength: 20
        originalBucket:
          type: string
          maxLength: 100
        originalStorageKey:
          type: string
          maxLength: 500
        sortOrder:
          type: number
          minimum: 0
        caption:
          type: string
          maxLength: 500
    UpdateProjectMediaDto:
      type: object
      properties:
        sortOrder:
          type: number
          minimum: 0
        caption:
          type: string
          maxLength: 500
        evaluationStatus:
          type: string
          enum:
            - pending
            - approved
            - rejected
        comment:
          type: string
          maxLength: 2000
          nullable: true
    BulkApproveProjectMediaDto:
      type: object
      properties:
        mediaIds:
          maxItems: 1000
          type: array
          items:
            type: string
            format: uuid
        comment:
          type: string
          maxLength: 2000
          nullable: true
      required:
        - mediaIds
    BulkApproveProjectsDto:
      type: object
      properties:
        projectIds:
          maxItems: 100
          type: array
          items:
            type: string
            format: uuid
        overrideRejected:
          type: boolean
          default: false
          description:
            Also approve files currently rejected; otherwise only pending files
            change.
        comment:
          type: string
          maxLength: 2000
          nullable: true
      required:
        - projectIds
    ReorderProjectMediaDto:
      type: object
      properties:
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - mediaIds
    SetProjectThumbnailDto:
      type: object
      properties:
        projectMediaId:
          type: string
          format: uuid
          nullable: true
    CreateUploadSessionDto:
      type: object
      properties:
        assetType:
          type: string
          enum:
            - image
            - video
        originalFilename:
          type: string
          maxLength: 255
        extension:
          type: string
          maxLength: 20
        mimeType:
          type: string
          maxLength: 100
        fileSizeBytes:
          type: number
          minimum: 1
        expectedChecksumSha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        targetProjectId:
          type: string
          format: uuid
          description: Project that owns this uploaded asset
        uploadBatchId:
          type: string
          format: uuid
          description:
            Groups files uploaded together so the project audit log shows one
            entry per batch. Without it the file is logged on its own.
      required:
        - assetType
        - originalFilename
        - mimeType
        - fileSizeBytes
        - targetProjectId
    UploadPartsDto:
      type: object
      properties:
        uploadSessionId:
          type: string
          format: uuid
        partNumbers:
          minItems: 1
          maxItems: 100
          description: Part numbers (1-based) to get presigned upload URLs for
          type: array
          items:
            type: number
      required:
        - uploadSessionId
        - partNumbers
    UploadClientMetricsDto:
      type: object
      properties:
        mode:
          type: string
          enum:
            - single
            - multipart
        transferMs:
          type: number
          description: Time spent sending the file content to storage, in ms
        partUrlWaitMs:
          type: number
          description: Time spent waiting for part URLs from the API, in ms
        partSize:
          type: number
        partCount:
          type: number
        parallelParts:
          type: number
        retries:
          type: number
          description: Failed part attempts that were retried
        concurrentUploads:
          type: number
          description: Files uploading at the same time in the browser
        minMbps:
          type: number
          description: Slowest speed over ~1 s stretches that sent data, in Mbps
        maxMbps:
          type: number
          description: Fastest speed over ~1 s stretches that sent data, in Mbps
        idleMs:
          type: number
          description:
            Time in stretches where nothing was sent (waiting on storage or
            part URLs), in ms
        networkType:
          type: string
          description: navigator.connection.effectiveType (Chromium only)
        downlinkMbps:
          type: number
          description: navigator.connection.downlink in Mbps (Chromium only)
        rttMs:
          type: number
          description: navigator.connection.rtt in ms (Chromium only)
      required:
        - mode
        - transferMs
    CompleteUploadDto:
      type: object
      properties:
        uploadSessionId:
          type: string
          format: uuid
        checksumSha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        metrics:
          $ref: "#/components/schemas/UploadClientMetricsDto"
      required:
        - uploadSessionId
    AbortUploadDto:
      type: object
      properties:
        uploadSessionId:
          type: string
          format: uuid
      required:
        - uploadSessionId
    UpdateRenderProfileDto:
      type: object
      properties: {}
    CreateWatermarkLogoUploadSessionDto:
      type: object
      properties:
        originalFilename:
          type: string
          maxLength: 255
        extension:
          type: string
          maxLength: 20
        fileSizeBytes:
          type: number
          minimum: 1
        expectedChecksumSha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        uploadBatchId:
          type: string
          format: uuid
          description:
            Groups files uploaded together so the project audit log shows one
            entry per batch. Without it the file is logged on its own.
        mimeType:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
      required:
        - originalFilename
        - fileSizeBytes
        - mimeType
    CreateRenderBatchDto:
      type: object
      properties: {}
    RerenderWatermarkDto:
      type: object
      properties: {}
    CreateDownloadDto:
      type: object
      properties: {}
    StartDriveConnectionResponseDto:
      type: object
      properties:
        authorizationUrl:
          type: string
        state:
          type: string
      required:
        - authorizationUrl
        - state
    SummarizeSourceDto:
      type: object
      properties:
        fileId:
          type: string
        driveId:
          type: string
      required:
        - fileId
    SummarizeSourcesDto:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SummarizeSourceDto"
      required:
        - projectId
        - sources
    GoogleDriveImportSourceDto:
      type: object
      properties:
        fileId:
          type: string
        driveId:
          type: string
        name:
          type: string
        mimeType:
          type: string
      required:
        - fileId
    CreateImportDto:
      type: object
      properties:
        projectId:
          type: string
          format: uuid
        sourceRootId:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/GoogleDriveImportSourceDto"

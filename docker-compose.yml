services:
  api:
    image: ag-go-api:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    cpus: ${API_CPUS:-2}
    deploy:
      resources:
        limits:
          cpus: '${API_CPUS:-2}'
          memory: ${API_MEMORY_LIMIT:-2g}
    restart: unless-stopped

  worker:
    # Reuses the image built by `api`. Declaring `build` here too makes Compose
    # build both services in parallel and race on the same tag
    # ("image ... already exists").
    image: ag-go-api:${TAG:-latest}
    pull_policy: never
    command: ['node', 'dist/workers/worker.js']
    # On SIGTERM the worker finishes its running jobs first (a Drive download can take up to
    # 2 minutes). Anything cut off by SIGKILL is resumed by the stale-job sweeps on the next start.
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-150s}
    env_file:
      - .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    mem_limit: ${WORKER_MEMORY_LIMIT:-2g}
    cpus: ${WORKER_CPUS:-2}
    deploy:
      resources:
        limits:
          cpus: '${WORKER_CPUS:-2}'
          memory: ${WORKER_MEMORY_LIMIT:-2g}
    restart: unless-stopped

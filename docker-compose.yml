services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aggo
      POSTGRES_PASSWORD: aggo
      POSTGRES_DB: aggo
    ports:
      - '5432:5432'
    volumes:
      - ag-go-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - ag-go-redis:/data

volumes:
  ag-go-postgres:
  ag-go-redis:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aggo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aggo}
      POSTGRES_DB: ${POSTGRES_DB:-aggo}
    ports:
      - '${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - ag-go-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aggo} -d ${POSTGRES_DB:-aggo}']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPUS:-1}
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPUS:-1}'
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - ag-go-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.5}
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPUS:-0.5}'
          memory: ${REDIS_MEMORY_LIMIT:-256m}

  api:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aggo}:${POSTGRES_PASSWORD:-aggo}@postgres:5432/${POSTGRES_DB:-aggo}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aggo}:${POSTGRES_PASSWORD:-aggo}@postgres:5432/${POSTGRES_DB:-aggo}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ag-go-postgres:
  ag-go-redis:

name: Deploy development

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - dev
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Never cancel a running deploy: killing the SSH session mid-recreate leaves the api down
# and half-replaced containers behind. A newer push waits and deploys right after.
concurrency:
  group: ag-go-api-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      # The commit the main host runs now; the worker hosts deploy the same one.
      commit: ${{ steps.deploy.outputs.commit }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST_DEV }}
      VPS_USER: ${{ secrets.VPS_USER_DEV }}
      VPS_PORT: ${{ secrets.VPS_PORT_DEV || '22' }}
      APP_PATH: ${{ secrets.VPS_APP_PATH_DEV || '/www/wwwroot/dev/ag-go-v2/ag-go-api' }}

    steps:
      - name: Verify CI success for commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Target commit SHA: $TARGET_SHA"
          echo "Triggering event: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "::error::Triggering CI workflow run concluded with '${{ github.event.workflow_run.conclusion }}'. Deployment halted."
              exit 1
            fi
            echo "CI workflow run completed successfully."
          else
            echo "Verifying CI status for commit $TARGET_SHA via GitHub API..."
            CI_CONCLUSION=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "ci.yml" \
              --commit "$TARGET_SHA" \
              --json status,conclusion \
              --jq '[.[] | select(.status == "completed")] | .[0].conclusion // empty')

            if [ "$CI_CONCLUSION" != "success" ]; then
              echo "::error::Commit $TARGET_SHA does not have a successful CI run (conclusion: '${CI_CONCLUSION:-none/in-progress}'). Manual deployment blocked."
              exit 1
            fi
            echo "CI verified successfully for commit $TARGET_SHA (conclusion: $CI_CONCLUSION)."
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY_DEV }}

      - name: Deploy via SSH
        id: deploy
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # Keepalives stop the connection being dropped while old workers drain silently.
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            sudo git config --global --add safe.directory '$APP_PATH'
            cd '$APP_PATH'
            sudo git fetch --quiet origin
            sudo git checkout --quiet --detach '$TARGET_SHA'
            TAG=\$(sudo git rev-parse --short HEAD)
            sudo env TAG=\$TAG bash ./deploy.sh
            echo DEPLOYED_COMMIT=\$(sudo git rev-parse HEAD)
          " | tee "$RUNNER_TEMP/deploy.log"
          echo "commit=$(grep -m1 '^DEPLOYED_COMMIT=' "$RUNNER_TEMP/deploy.log" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

  # Extra VPSs running only workers (see deploy-worker-hosts.yml), once the main host is up.
  deploy-workers:
    needs: deploy
    if: ${{ vars.WORKER_HOSTS_DEV != '' && vars.WORKER_HOSTS_DEV != '[]' }}
    uses: ./.github/workflows/deploy-worker-hosts.yml
    with:
      commit: ${{ needs.deploy.outputs.commit }}
      hosts: ${{ vars.WORKER_HOSTS_DEV }}
      default-key-secret: WORKER_SSH_KEY_DEV
    # Each host reads its own key secret, named in the hosts JSON.
    secrets: inherit

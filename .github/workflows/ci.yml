name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ag_go_test
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3738
      DATABASE_URL: postgres://postgres:postgres@localhost:55434/ag_go_test
      DATABASE_SCHEMA: public
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55434/ag_go_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Copy environment template
        run: cp .env.example .env

      - name: Check code formatting
        run: yarn format:check

      - name: Lint source code
        run: yarn lint

      - name: Check TypeScript types
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test

      - name: Run database tests
        run: yarn test:db

      - name: Build application
        run: yarn build

      - name: Verify OpenAPI specification
        run: |
          yarn openapi:generate
          git diff --exit-code openapi.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ag-go-api:test
          build-args: |
            GIT_COMMIT=${{ github.sha }}

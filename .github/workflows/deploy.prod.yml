name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ag-go-api-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      # The commit the main host runs now; the worker hosts deploy the same one.
      commit: ${{ steps.deploy.outputs.commit }}
    environment:
      name: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_PATH: ${{ secrets.VPS_APP_PATH || '/www/wwwroot/prod/ag-go-v2/ag-go-api' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy via SSH
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          # Keepalives stop the connection being dropped while old workers drain silently.
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            sudo git config --global --add safe.directory '$APP_PATH'
            cd '$APP_PATH'
            sudo git pull --ff-only origin main
            TAG=\$(sudo git rev-parse --short HEAD)
            sudo env TAG=\$TAG bash ./deploy.sh
            echo DEPLOYED_COMMIT=\$(sudo git rev-parse HEAD)
          " | tee "$RUNNER_TEMP/deploy.log"
          echo "commit=$(grep -m1 '^DEPLOYED_COMMIT=' "$RUNNER_TEMP/deploy.log" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

  # Extra VPSs running only workers (see deploy-worker-hosts.yml), once the main host is up.
  deploy-workers:
    needs: deploy
    if: ${{ vars.WORKER_HOSTS != '' && vars.WORKER_HOSTS != '[]' }}
    uses: ./.github/workflows/deploy-worker-hosts.yml
    with:
      commit: ${{ needs.deploy.outputs.commit }}
      hosts: ${{ vars.WORKER_HOSTS }}
      default-key-secret: WORKER_SSH_KEY
    # Each host reads its own key secret, named in the hosts JSON.
    secrets: inherit

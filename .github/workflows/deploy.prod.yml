name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ag-go-api-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.deploy.outputs.commit }}
    environment:
      name: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_PATH: ${{ secrets.VPS_APP_PATH || '/www/wwwroot/prod/ag-go-v2/ag-go-api' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Start SSH agent
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS_PROD || secrets.SSH_KNOWN_HOSTS || secrets.VPS_KNOWN_HOSTS_PROD || secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::SSH known hosts secret is missing or empty. Please save target host public key in SSH_KNOWN_HOSTS_PROD or SSH_KNOWN_HOSTS secret."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SSH
        id: deploy
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Keepalives stop the connection being dropped while old workers drain silently.
          ssh -o ServerAliveInterval=30 -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -e
            sudo git config --global --add safe.directory '$APP_PATH'
            cd '$APP_PATH'
            sudo git fetch --quiet origin
            sudo git checkout --quiet --detach '$TARGET_SHA'
            TAG=\$(sudo git rev-parse --short HEAD)
            sudo env TAG=\$TAG bash ./deploy.sh
            echo DEPLOYED_COMMIT=\$(sudo git rev-parse HEAD)
          " | tee "$RUNNER_TEMP/deploy.log"
          echo "commit=$(grep -m1 '^DEPLOYED_COMMIT=' "$RUNNER_TEMP/deploy.log" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

  deploy-workers:
    needs: deploy
    if: ${{ vars.WORKER_HOSTS != '' && vars.WORKER_HOSTS != '[]' }}
    uses: ./.github/workflows/deploy-worker-hosts.yml
    with:
      commit: ${{ needs.deploy.outputs.commit }}
      hosts: ${{ vars.WORKER_HOSTS }}
      default-key-secret: WORKER_SSH_KEY
      known-hosts-secret: SSH_KNOWN_HOSTS
    secrets: inherit
